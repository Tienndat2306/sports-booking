# Dựng đủ bốn hệ CSDL cho đồ án "Quản lý sân thể thao và đặt lịch"
# Chạy:  docker compose up -d      (lần đầu mất khoảng 1-3 phút vì Cassandra khởi động chậm)
# Xóa sạch dữ liệu:  docker compose down -v

name: sports-booking

services:
  # ---------- MongoDB (replica set một nút để dùng transaction) ----------
  mongo:
    image: mongo:7
    container_name: sb-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: sb-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./mongo:/scripts:ro
    command:
      - sh
      - -c
      - "mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet /scripts/01-init.js && mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet /scripts/02-seed.js"
    restart: "no"

  # ---------- Cassandra ----------
  cassandra:
    image: cassandra:5.0
    container_name: sb-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: sports-booking
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  cassandra-init:
    image: cassandra:5.0
    container_name: sb-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra:/scripts:ro
    command:
      - sh
      - -c
      - "cqlsh cassandra -f /scripts/01-schema.cql && cqlsh cassandra -f /scripts/02-seed.cql"
    restart: "no"

  # ---------- Neo4j ----------
  neo4j:
    image: neo4j:5-community
    container_name: sb-neo4j
    ports:
      - "7474:7474"   # trình duyệt Neo4j
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-sbneo4j2026}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-sbneo4j2026} 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  neo4j-init:
    image: neo4j:5-community
    container_name: sb-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j:/scripts:ro
    entrypoint: ["sh", "-c"]
    command:
      - "cypher-shell -a bolt://neo4j:7687 -u neo4j -p ${NEO4J_PASSWORD:-sbneo4j2026} -f /scripts/01-schema.cypher && cypher-shell -a bolt://neo4j:7687 -u neo4j -p ${NEO4J_PASSWORD:-sbneo4j2026} -f /scripts/02-seed.cypher"
    restart: "no"

  # ---------- Redis ----------
  redis:
    image: redis:7.2
    container_name: sb-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-init:
    image: redis:7.2
    container_name: sb-redis-init
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./redis:/scripts:ro
    command: ["sh", "/scripts/init.sh"]
    restart: "no"

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
  redis_data:
