<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- [Module 1] Trang chủ Tìm kiếm & Xếp hạng sân (UC08, FR23) -->
<section th:fragment="homeSearchSection" id="home" class="scr">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <span class="tag bg-emerald-50 text-emerald-700">Đặt sân trực tuyến</span>
      <h1 class="mt-1 text-2xl font-bold">Tìm kiếm & Đặt sân thể thao</h1>
    </div>
    <span class="text-xs text-slate-500">Đặt trước tối đa 30 ngày · Khung chuẩn 60 phút (05:00 – 22:00)</span>
  </div>

  <!-- Bộ lọc tìm kiếm (UC08) -->
  <div class="card mt-4 grid gap-3 sm:grid-cols-5">
    <select id="filterSport" class="in" onchange="renderFacilities()">
      <option value="ALL">Tất cả môn (3 môn)</option>
      <option value="FOOTBALL5">Bóng đá 5 người</option>
      <option value="BADMINTON">Cầu lông</option>
      <option value="VOLLEYBALL">Bóng chuyền</option>
    </select>
    <select id="filterDistrict" class="in" onchange="renderFacilities()">
      <option value="ALL">Gần tôi nhất (Bán kính 5km)</option>
      <option value="Tân Phú">Quận Tân Phú (Cơ sở 1)</option>
      <option value="Tân Bình">Quận Tân Bình (Cơ sở 2)</option>
    </select>
    <input type="date" class="in" value="2026-11-20">
    <select class="in">
      <option>Mọi khung giờ (05:00 – 22:00)</option>
      <option>Giờ thường (05:00 – 17:00)</option>
      <option>Giờ cao điểm (17:00 – 22:00)</option>
    </select>
    <button class="btn" onclick="go('schedule')"><i data-lucide="search" class="h-4 w-4"></i>Xem lịch trống</button>
  </div>

  <!-- Bảng xếp hạng Top Sân Đặt Nhiều Nhất Tháng -->
  <div class="mt-6">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500">🔥 Sân được đặt nhiều nhất tháng này</h2>
    </div>
    <div class="mt-3 grid gap-3 sm:grid-cols-3" id="topCourts"></div>
  </div>

  <!-- Danh sách 2 cơ sở & Tọa độ địa lý -->
  <div class="mt-6 grid gap-4 md:grid-cols-2" id="fac"></div>
</section>
</body>
</html>
