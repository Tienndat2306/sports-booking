<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- [Module 3] Cộng đồng & Sàn ghép kèo Neo4j (UC16, UC17, UC18) -->
<section th:fragment="matchmakingSection" id="match" class="scr">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <span class="tag bg-emerald-50 text-emerald-700">Giao lưu thể thao</span>
      <h1 class="mt-1 text-2xl font-bold">Cộng đồng & Ghép kèo thi đấu</h1>
    </div>
    <button class="btn" onclick="openModal('createMatchModal')"><i data-lucide="plus" class="h-4 w-4"></i>Đăng kèo tuyển người</button>
  </div>

  <div class="mt-5 grid gap-5 md:grid-cols-3">
    <!-- Cột danh sách kèo (2/3) -->
    <div class="space-y-4 md:col-span-2">
      <div class="flex flex-wrap gap-2">
        <span class="chip on" onclick="filterMatches('ALL', this)">Tất cả môn</span>
        <span class="chip" onclick="filterMatches('FOOTBALL5', this)">Bóng đá 5 người</span>
        <span class="chip" onclick="filterMatches('BADMINTON', this)">Cầu lông</span>
        <span class="chip" onclick="filterMatches('VOLLEYBALL', this)">Bóng chuyền</span>
      </div>
      <div id="matchFeed" class="space-y-4"></div>
    </div>

    <!-- Cột mạng xã hội & gợi ý từ Đồ thị Neo4j (1/3 - Nhúng từ social-network.html) -->
    <div th:replace="~{community/social-network :: socialSidebar}"></div>
  </div>
</section>
</body>
</html>
