spring:
  application:
    name: sportsbooking

  # 1. MongoDB (Replica set 1 nút để hỗ trợ Transaction)
  # Khai báo cả spring.mongodb (Spring Boot 4.x) và spring.data.mongodb để tương thích hoàn toàn
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27018/sports_booking?replicaSet=rs0&directConnection=true}
    database: sports_booking
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27018/sports_booking?replicaSet=rs0&directConnection=true}
      database: sports_booking
      auto-index-creation: false

    # 4. Redis (Hold slots, Cache, Rate limit, Streams)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s

  # 2. Apache Cassandra (Trạng thái khung giờ, Lịch sử, Thống kê, Audit)
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:sports_booking}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none
    request:
      timeout: 10s
      consistency: local_quorum

  # 3. Neo4j (Mạng xã hội thể thao, Ghép trận, Gợi ý)
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:sbneo4j2026}

  # Thymeleaf
  thymeleaf:
    cache: false
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

# Cấu hình nghiệp vụ dùng chung của dự án (Chương 3 - mục 3.1.1 & 3.7)
app:
  timezone: Asia/Ho_Chi_Minh
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:389791032309-ha38ggklmlvjejqnvdeucoora43nn191.apps.googleusercontent.com}
  booking:
    max-advance-days: 30
    default-hold-seconds: 300
    slot-minutes: 60
  redis:
    stream-events: sb:stream:events
    consumer-groups:
      neo4j: cg-neo4j
      stats: cg-stats
      cache: cg-cache
